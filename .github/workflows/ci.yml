name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug build
        run: ./gradlew lint test assembleDebug --stacktrace

      # The privacy promise relies on there being no INTERNET permission. List every permission in
      # the merged manifest (libraries included, e.g. Play Billing) and where each came from.
      - name: Merged manifest permissions
        run: |
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*debug*' | head -n 1)
          echo "Merged manifest: $manifest"
          tr '\n' ' ' < "$manifest" | grep -o '<uses-permission[^>]*>' | sed 's/  */ /g' | sort -u
          echo "--- Permission sources (manifest merger report) ---"
          grep -A3 'uses-permission' app/build/outputs/logs/manifest-merger-debug-report.txt || true
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The merged manifest has the INTERNET permission; the privacy promise says it doesn't."
            exit 1
          fi

      # Payments have one switch (billingEnabled in app/build.gradle.kts). While it is off, release
      # builds must not declare Play Billing's BILLING permission (app/src/billingOff); with it on,
      # they must. INTERNET is never allowed. Merging the manifest needs no signing.
      - name: Release manifest permissions
        run: |
          ./gradlew processReleaseManifest --console=plain
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' | head -n 1)
          echo "Merged release manifest: $manifest"
          tr '\n' ' ' < "$manifest" | grep -o '<uses-permission[^>]*>' | sed 's/  */ /g' | sort -u
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "::error::The merged release manifest has the INTERNET permission."
            exit 1
          fi
          if grep -Eq 'val billingEnabled.*\?: false' app/build.gradle.kts; then
            if grep -q 'com.android.vending.BILLING' "$manifest"; then
              echo "::error::Payments are off, but the release manifest still declares com.android.vending.BILLING."
              exit 1
            fi
            echo "Payments off: no BILLING permission in the release manifest."
          else
            grep -q 'com.android.vending.BILLING' "$manifest" || { echo "::error::Payments are on, but the release manifest lacks com.android.vending.BILLING."; exit 1; }
            echo "Payments on: BILLING permission present."
          fi

      # Release builds need keystore.properties, which CI doesn't have: bundleRelease must stop
      # with the clear signing message (and not with any other error).
      - name: Release build without signing fails clearly
        run: |
          set +e
          ./gradlew bundleRelease --console=plain > release.log 2>&1
          status=$?
          set -e
          tail -n 30 release.log
          if [ $status -eq 0 ]; then
            echo "::error::bundleRelease succeeded without keystore.properties"
            exit 1
          fi
          grep -q "Release signing is not configured" release.log || { echo "::error::bundleRelease failed for another reason"; exit 1; }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
